# Deployed copy of the audio proxy config, for reference and rebuilds.

# ── /etc/nginx/audio-proxy.conf ──────────────────────────────────────────────
# Shared settings for the api.example.com /Audio* blocks, which proxy to the compose.yaml services.
#
# Deliberately declares no add_header. nginx inherits add_header from an outer level ONLY when the
# current level declares none of its own, so a single CORS header here would silently drop HSTS,
# CSP, X-Content-Type-Options and Referrer-Policy from ssl.conf and headers.conf. The app sets
# Access-Control-Allow-Origin itself, wide open on purpose (see Gaida.API/Program.cs), so the
# proxy_hide_header/add_header pair these blocks used to carry was re-adding an identical value at
# the cost of every security header on the vhost.
#
# This mirrors /etc/nginx/proxy.conf but deliberately omits proxy_read_timeout and
# proxy_send_timeout: nginx rejects a directive that appears twice in one context, and includes are
# textual, so including proxy.conf here would make the per-location timeouts below a duplicate
# rather than an override. Each /Audio* block sets its own.

proxy_redirect          off;
proxy_set_header        Host $host;
proxy_set_header        X-Real-IP $remote_addr;
proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header        X-Forwarded-Proto $scheme;
client_max_body_size    10m;
client_body_buffer_size 128k;
proxy_connect_timeout   90;
proxy_buffers           32 4k;

# HTTP/1.0 -- nginx's proxy default -- has no chunked transfer encoding, so a streaming body with
# no Content-Length cannot be relayed incrementally. Required for the audio paths, not tuning.
proxy_http_version 1.1;

# ── /etc/nginx/upstreams.conf (the names the /Audio* blocks proxy to) ────────
# One entry per published compose port. stih is the newest; the rest were here already.
#
# upstream dunav    { server 127.0.0.1:5341; }
# upstream selo     { server 127.0.0.1:5342; }
# upstream dom      { server 127.0.0.1:5343; }
# upstream stih     { server 127.0.0.1:5345; }
# upstream gaida_api { server 127.0.0.1:5340; }

# ── /etc/nginx/sites/api.example.com.conf (the /Audio* half; rest of the vhost unchanged) ──
  # Covers /Audio/Download/{codec}/{bitrate} and /Audio/DownloadRaw on one prefix.
  # Must never point at gaida_api: Dunav's coalescing is what stops N simultaneous requests for a
  # cold track from becoming N ffmpeg processes, and it only holds if every content request goes
  # through it.
  location /Audio/Download {
    include /etc/nginx/audio-proxy.conf;
    proxy_pass http://dunav;

    # Audio plays while it encodes. With buffering on, nginx holds the whole encode before sending
    # a byte -- 1.9s of silence on a cold 3:22 track, measured.
    proxy_buffering off;
    proxy_request_buffering off;

    # proxy.conf's 90s covers the gap between bytes, which is fine mid-stream but not the cold start.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    gzip off;   # opus/aac/mp3 are already compressed
  }

  # Warms an encode, returns 202/200 with no body.
  location /Audio/Preload {
    include /etc/nginx/audio-proxy.conf;
    proxy_pass http://dunav;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
  }

  # /Audio/Search, /Audio/RandomResults, /Audio/Cover, /Audio/FindQueryType,
  # /Audio/Local/Variant, /Audio/Browse, /Audio/Artist/*.
  location /Audio {
    include /etc/nginx/audio-proxy.conf;
    proxy_pass http://gaida_api;

    # The discovery endpoints write their JSON array element by element so the client can render each
    # track as it lands. With buffering on, nginx holds the whole array and hands it over at the end --
    # the same lesson as the /Audio/Download block above, for search results instead of audio.
    proxy_buffering off;

    # A gap between elements, not a total: a long playlist resolved track by track keeps resetting it.
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
  }

  # Accounts and playlists. Two prefixes rather than one invented /Audio/Dom, so the public paths keep
  # saying what they are; both land on the same service and neither needs anything the plain /Audio
  # block does not already give. proxy_pass must come before the /Audio block in intent only -- nginx
  # picks the longest matching prefix, not the first, so the order in this file is cosmetic.
  #
  # Everything here carries a password or a bearer token in the request. TLS on this vhost is not a
  # hardening step for these two locations, it is the whole confidentiality story: served over plain
  # HTTP they hand out credentials to anyone on the path.
  location /Audio/Accounts {
    include /etc/nginx/audio-proxy.conf;
    proxy_pass http://dom;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
  }

  # client_max_body_size in audio-proxy.conf is 10m, which already covers the 2 MB playlist cover
  # upload that lands here in phase 7.
  location /Audio/Playlists {
    include /etc/nginx/audio-proxy.conf;
    proxy_pass http://dom;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
  }

  # One block for CreateRoom, Rooms and Join -- all under this prefix, all happy on these settings.
  # $connection_upgrade comes from the map in nginx.conf:14 and sends "close" on a non-upgrade
  # request, where the old hardcoded "Upgrade" was sent unconditionally.
  location /Audio/Multiplayer {
    include /etc/nginx/audio-proxy.conf;
    proxy_pass http://selo;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Rooms stay open for hours; proxy.conf's 90s would drop every member of a quiet room.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # The lyrics service. Only /Audio/Lyrics is proxied: stih's other route, /register, is how the
  # platform pods hand it what they downloaded, and nothing on the public side has any business
  # reaching it. A first lookup for a cold track can wait on lrclib.net, hence the 30s rather than
  # the default — it answers from disk on every later request, and the response carries a day of
  # Cache-Control anyway.
  location /Audio/Lyrics {
    include /etc/nginx/audio-proxy.conf;
    proxy_pass http://stih;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

     

# ── /etc/nginx/sites/admin.example.com.conf — the admin panel (optional) ─────────
# compose.yaml publishes Oko on 0.0.0.0:5344 and leaves access to the host firewall, which is the
# simplest arrangement and needs none of this. What the firewall cannot do is protect the password:
# HTTP Basic sends it base64-encoded on every request, in clear, and that one password reaches every
# account in Dom and every room in Selo. On any network where the path is not fully trusted, put
# this in front and change the oko ports entry back to "127.0.0.1:${OKO_PORT:-5344}:8080".
#
# The alternative, and the smaller thing to maintain: bind Oko to loopback and reach it over an SSH
# tunnel — `ssh -L 5344:127.0.0.1:5344 host` — which needs no vhost, no certificate and no block
# below. Prefer that if the panel only ever has one user on one laptop.
#
# server {
#   listen 443 ssl;
#   listen [::]:443 ssl;
#   server_name admin.example.com;
#
#   include /etc/nginx/ssl.conf;
#   include /etc/nginx/headers.conf;
#
#   location / {
#     include /etc/nginx/audio-proxy.conf;
#     proxy_pass http://127.0.0.1:5344;
#
#     # Do NOT add an auth_basic here. It would be a second, separate password in front of Oko's
#     # own, and the browser would prompt twice — Oko already challenges, and its check is the one
#     # that gates every action and names the operator in the audit log.
#
#     # /api/events is Server-Sent Events: one response that never finishes. Buffering it means the
#     # live feed shows nothing at all, and the default 90s read timeout would cut it every 90s.
#     proxy_buffering off;
#     proxy_read_timeout 3600s;
#     proxy_send_timeout 3600s;
#   }
# }
