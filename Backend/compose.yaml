# Gaida Project Docker Compose
# see the nginx example config for more info.
#
# Every host-specific value and every secret lives in .env beside this file, which
# docker compose reads on its own and .gitignore keeps out of the repository. The
# defaults below are what a fresh checkout runs on; .env is what this host runs on.

#
#   /Audio/Download*, /Audio/Preload*  → 127.0.0.1:5341  (dunav)
#   /Audio/Multiplayer*                → 127.0.0.1:5342  (selo, WebSocket upgrade)
#   /Audio/Accounts*, /Audio/Playlists* → 127.0.0.1:5343  (dom)
#   everything else                    → 127.0.0.1:5340  (gaida-api)
#
# The admin panel is not on that list: it is published on 0.0.0.0:5344 and fronted by the host
# firewall rather than by nginx. See the oko service at the bottom of this file and ADMIN_PLAN.md.

name: gaida

x-service: &service
  restart: unless-stopped
  environment: &env
    ASPNETCORE_URLS: http://+:8080
    ASPNETCORE_ENVIRONMENT: Production
    # DiscoveryContracts.cs:83 ignores PublicApiBaseUrl in Development — this has to be Production.

    # The shared secret Oko authenticates itself with. Every service gets it, because every service
    # answers /Admin/*. Unset, each one disables its admin surface entirely and answers 404 there —
    # the stack runs exactly as before, and Oko renders every target as down with that as the reason.
    ADMIN_TOKEN: ${ADMIN_TOKEN:-}

services:
  # ── Platform pods ──────────────────────────────────────────────────────────────
  # Each owns its own storage and its own caching. Neither is replicable: local is
  # pinned to the library, and a second YouTube pod shares one egress IP and just
  # reaches YouTube's rate limit sooner.

  gaida-local:
    <<: *service
    build:
      context: .
      dockerfile: Platforms/Gaida.Pods.MusicDatabase/Dockerfile
    environment:
      <<: *env
      STORAGE: /music
      ALBUM_COVERS: /covers
      # Public prefix substituted into MusicInfo.CoverUrl (MusicManager.cs:58). Needs the scheme:
      # the value becomes an absolute thumbnailUrl that Cover.cs fetches with HttpClient, and a
      # bare "example.com/" is not a URL it can resolve.
      DOMAIN: ${PUBLIC_DOMAIN:-http://localhost}
      # Only the admin surface uses this: Oko's "To library" button on the Deezer cache posts to this
      # pod's /Admin/import-deezer, which pulls the track's metadata and bytes from there and writes
      # them into the library's Deezer/ folder. Unset, that one route answers 400 and nothing else
      # changes — this is the library pod's only outbound call.
      DEEZER_URL: http://gaida-deezer:8080
    # The only service that writes into a directory the host also owns, so the only one whose
    # container user matters: imports and Info.json rewrites land as this uid:gid instead of root.
    # A Dockerfile cannot do this -- the host's uid is not known at build time -- so it lives here
    # with the rest of the host-specific values, in .env.
    user: "${LIBRARY_UID:-1000}:${LIBRARY_GID:-1000}"
    volumes:
      # Read-write, not :ro — MusicManager.cs:77 opens Info.json OpenOrCreate/ReadWrite,
      # CoverExtractor.cs:25,50 rewrites it and writes extracted covers, and the tag
      # re-read migration in MUSICDB_FORMAT_PLAN.md rewrites every Info.json in the tree.
      - ${MUSIC_LIBRARY_PATH:-./data/music}:/music
      # The web root nginx serves as $PUBLIC_DOMAIN/Album_Covers — which is exactly what
      # DOMAIN builds the public thumbnailUrl from, so covers written here are immediately
      # fetchable. 1487 covers, 401M.
      - ${ALBUM_COVERS_PATH:-./data/covers}:/covers

  gaida-youtube:
    <<: *service
    build:
      context: .
      dockerfile: Platforms/Gaida.Pods.YouTube/Dockerfile
    environment:
      <<: *env
      YOUTUBE_CACHE_DB: /cache/YouTube.json   # YouTubeCacher — the search cache
      YOUTUBE_CACHE: /webm                    # GetterLocalCache / YouTubeCacheProvider
    volumes:
      - ${YOUTUBE_CACHE_DB_PATH:-./data/youtube-cache}:/cache
      # The existing webm cache — 25463 files, 90G; pointing this anywhere else starts empty
      # and re-downloads the lot from YouTube.
      - ${YOUTUBE_AUDIO_CACHE_PATH:-./data/youtube-audio}:/webm
    # Image needs yt-dlp on PATH for GetterYtDlp.

  # The one pod that is not .NET: Python over SpotAPI, which reaches Spotify's own web endpoints and so
  # needs no client ID, no secret and no premium account — there is nothing to put in .env for it.
  # Metadata only: Spotify hands over track names, and Gaida.API resolves each one against the library or
  # YouTube (Platforms__2__Resolve below).
  #
  # SpotAPI is unofficial, so this is the pod most likely to start finding nothing after a change at
  # Spotify's end, and the one whose egress IP matters — every request leaves from this host.
  gaida-spotify:
    <<: *service
    build:
      context: .
      dockerfile: Platforms/Gaida.Pods.Spotify/Dockerfile
    environment:
      <<: *env
      # How many search hits to hand back. Each one costs Gaida.API a lookup against the library or
      # YouTube, so it is a budget rather than a page size.
      SPOTIFY_SEARCH_LIMIT: ${SPOTIFY_SEARCH_LIMIT:-15}

  # The other Python pod, and the only one that both finds tracks and owns their audio. Metadata comes
  # from Deezer's public REST API and needs nothing; the audio needs DEEZER_ARL, an account cookie —
  # see https://github.com/nathom/streamrip/wiki/Finding-Your-Deezer-ARL-Cookie, which is also where
  # the download and decrypt logic in this pod comes from.
  #
  # Without an ARL the pod is metadata-only like the Spotify one, and DEEZER_RESOLVE below is what
  # tells Gaida.API to treat it that way. With one, it downloads MP3 320 by default and FLAC only when
  # the listener has picked the FLAC codec or an operator promotes a track in Oko.
  gaida-deezer:
    <<: *service
    build:
      context: .
      dockerfile: Platforms/Gaida.Pods.Deezer/Dockerfile
    environment:
      <<: *env
      DEEZER_ARL: ${DEEZER_ARL:-}
      DEEZER_SEARCH_LIMIT: ${DEEZER_SEARCH_LIMIT:-15}
      DEEZER_PLAYLIST_LIMIT: ${DEEZER_PLAYLIST_LIMIT:-1000}
      DEEZER_CACHE: /cache
      # A disk budget, like Dunav's, sized against free space on the volume below. 20 GiB is roughly
      # 2000 tracks at MP3 320 or 500 at FLAC; the oldest go first when it is reached.
      DEEZER_CACHE_MAX_BYTES: ${DEEZER_CACHE_MAX_BYTES:-21474836480}
      DEEZER_ADMIN_ROWS: ${DEEZER_ADMIN_ROWS:-200}
    volumes:
      # A real cache: losing it costs re-downloads, nothing else. Tracks promoted into the music
      # library live under MUSIC_LIBRARY_PATH instead and are not affected by anything here.
      - ${DEEZER_CACHE_PATH:-./data/deezer-audio}:/cache

  # ── Proxy + encoder ────────────────────────────────────────────────────────────
  # The only stateless service, and so the only one worth scaling:
  #   docker compose up -d --scale gaida-api=4
  # Dunav being single-instance is what makes that safe — dedup happens upstream, so
  # four replicas never encode the same track twice.
  gaida-api:
    <<: *service
    build:
      context: .
      dockerfile: Services/Gaida.API/Dockerfile
    environment:
      <<: *env
      Platforms__0__Url: http://gaida-local:8080
      Platforms__0__Ids: audio://
      Platforms__1__Url: http://gaida-youtube:8080
      Platforms__1__Ids: yt://,yt-playlist://
      Platforms__2__Url: http://gaida-spotify:8080
      Platforms__2__Ids: spotify://,spotify-playlist://
      # Its results are names, not playable IDs -- see Gaida.API/PlayableResolver.cs.
      Platforms__2__Resolve: "true"
      Platforms__3__Url: http://gaida-deezer:8080
      Platforms__3__Ids: deezer://,deezer-playlist://
      # The one knob to turn after putting DEEZER_ARL in .env: set it to false, and Deezer results are
      # played from Deezer instead of being looked up again on the library or YouTube. Left true, the
      # pod is metadata-only and the stack behaves as it did before it existed — which is also what a
      # fresh checkout with no ARL needs. Deliberately not derived from ${DEEZER_ARL:+…}: an empty
      # value here makes ManagerService.cs's GetValue<bool> throw rather than fall back to the default.
      Platforms__3__Resolve: ${DEEZER_RESOLVE:-true}
      Resolve__Concurrency: ${RESOLVE_CONCURRENCY:-4}
      PublicApiBaseUrl: ${PUBLIC_API_BASE_URL:-http://localhost:5340}
      THUMBNAIL_CACHE: /thumbnails
      # Content.cs:86-99 — the platform name lives here rather than in code.
      Random__Shares__youtube: ${YOUTUBE_RANDOM_SHARE:-0.4}
    ports:
      # Host ports are the 534x block; the container always listens on 8080.
      - "127.0.0.1:${GAIDA_API_PORT:-5340}:8080"
    volumes:
      - thumbnails:/thumbnails
    # Image needs ffmpeg on PATH.

  # ── Fan-out cache ──────────────────────────────────────────────────────────────

  dunav:
    <<: *service
    build:
      context: .
      dockerfile: Services/Dunav/Dockerfile
    environment:
      <<: *env
      Gaida__Url: http://gaida-api:8080
      Dunav__RetentionMinutes: ${DUNAV_RETENTION_MINUTES:-45}
      # Bodies live here as ordinary files, one per cache key. Deliberately NOT a tmpfs mount and
      # deliberately not a bind mount of the host's /tmp: tmpfs pages are charged to this container's
      # memory cgroup and cannot be reclaimed, which is the OOM this design exists to avoid. Left
      # unmounted, /tmp is the overlay2 layer on / -- ordinary files, reclaimable page cache.
      # See DUNAV_SPILL_PLAN.md.
      Dunav__CacheDir: /tmp/dunav
      # A DISK budget now, not a memory one, so it is sized against free space on / rather than
      # against mem_limit (see .env).
      Dunav__MaxBytes: ${DUNAV_MAX_BYTES:-21474836480}
    ports:
      - "127.0.0.1:${DUNAV_PORT:-5341}:8080"
    # Was 6g when the cache lived on the heap. Resident memory is now the runtime plus roughly
    # 64 KiB per in-flight connection, independent of catalog size. Watch it before trimming further.
    mem_limit: ${DUNAV_MEMORY_LIMIT:-1g}

  # ── Rooms ──────────────────────────────────────────────────────────────────────

  selo:
    <<: *service
    build:
      context: .
      dockerfile: Services/Selo/Dockerfile
    environment:
      <<: *env
      # Room.cs:135 — the single audio coupling, SearchID only.
      Gaida__Url: http://gaida-api:8080
    ports:
      - "127.0.0.1:${SELO_PORT:-5342}:8080"

  # ── Accounts and playlists ─────────────────────────────────────────────────────
  # Talks to nothing. Unlike every other service here, losing its volume loses real
  # user data rather than a cache that refills itself — this is the one to back up.

  dom:
    <<: *service
    build:
      context: .
      dockerfile: Services/Dom/Dockerfile
    environment:
      <<: *env
      Dom__DataFile: /data/dom.json
      Dom__CoverDir: /covers
    ports:
      - "127.0.0.1:${DOM_PORT:-5343}:8080"
    volumes:
      # A named volume, deliberately unlike Dunav's cache dir: that one is throwaway
      # by design, this one is the accounts.
      - dom-data:/data
      # Uploaded playlist covers. Losing these loses artwork, not playlists.
      - dom-covers:/covers

  # ── The admin panel ────────────────────────────────────────────────────────────
  # Reads every other service and moderates them. Holds no state of its own: no volume, nothing to
  # back up, and losing it loses nothing. It is also the only service here that talks to all of the
  # others, and the only one nothing talks to.

  oko:
    <<: *service
    build:
      context: .
      dockerfile: Services/Oko/Dockerfile
    environment:
      <<: *env
      # No default for either: Oko refuses to boot rather than serve an unauthenticated admin panel,
      # so a missing password is a crash-loop in `docker compose logs oko` and never an open door.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      # Everything Oko watches. Names are what the panel shows; gaida-local's must stay as it is,
      # since the library editor keys off the name the pod reports for itself.
      Targets__0__Name: dunav
      Targets__0__Url: http://dunav:8080
      Targets__1__Name: selo
      Targets__1__Url: http://selo:8080
      Targets__2__Name: dom
      Targets__2__Url: http://dom:8080
      Targets__3__Name: gaida-api
      Targets__3__Url: http://gaida-api:8080
      Targets__4__Name: gaida-local
      Targets__4__Url: http://gaida-local:8080
      Targets__5__Name: gaida-youtube
      Targets__5__Url: http://gaida-youtube:8080
      Targets__6__Name: gaida-spotify
      Targets__6__Url: http://gaida-spotify:8080
      Targets__7__Name: gaida-deezer
      Targets__7__Url: http://gaida-deezer:8080
    ports:
      # The one port in this file NOT bound to 127.0.0.1: published on every interface so the host
      # firewall decides who reaches it, as asked. That makes the firewall the only thing between
      # the internet and every account in Dom, and Basic auth sends its password in plain base64 —
      # so if this port is reachable from anywhere untrusted, put the nginx TLS block from
      # nginx.example.conf in front of it and bind this back to 127.0.0.1.
      - "${OKO_PORT:-5344}:8080"

volumes:
  thumbnails:
  dom-data:
  dom-covers:
