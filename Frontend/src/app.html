<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- the svg is the mark itself; the png is the fallback for browsers that take no svg icon -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#14121f" />
		<!-- the whole screen, notch and gesture bar included: app.css keeps the app to the safe
		     part of it and lets the full player's ground run under the rest. iOS draws its status
		     bar over the page only when it is told to be translucent. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-surface-0 text-chalk font-body flex flex-col items-center leading-relaxed antialiased"
	>
		%sveltekit.body%
	</body>
</html>
